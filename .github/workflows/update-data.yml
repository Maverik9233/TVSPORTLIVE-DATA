name: TVSPORTLIVE Data Update

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run TVSPORTLIVE generator
        env:
          TVSPORTLIVE_DROPBOX_REFRESH_TOKEN: ${{ secrets.TVSPORTLIVE_DROPBOX_REFRESH_TOKEN }}
          TVSPORTLIVE_DROPBOX_APP_KEY: ${{ secrets.TVSPORTLIVE_DROPBOX_APP_KEY }}
          TVSPORTLIVE_DROPBOX_APP_SECRET: ${{ secrets.TVSPORTLIVE_DROPBOX_APP_SECRET }}
        run: |
          python generator/main.py
