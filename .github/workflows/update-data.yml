name: TVSPORTLIVE Data Update

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvsportlive-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run TVSPORTLIVE generator
        run: |
          python generator/main.py

      - name: Check generated files
        run: |
          test -s data/events.txt
          test -s data/live.txt

      - name: Commit generated data
        run: |
          git config user.name "TVSPORTLIVE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.txt data/live.txt

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Update sports data"
            git push
          fi
